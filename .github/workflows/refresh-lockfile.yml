name: Refresh Lockfile

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    # Dispatch may load a reviewed workflow branch, but always repairs the default branch.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Resolution-only installs do not populate the package store. Do not
          # claim the shared cache key with an empty archive before full installs.
          package-manager-cache: false

      - name: Refresh pnpm lockfile
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          git push --force origin "$BRANCH"

          # Only reuse an open PR from this repository owner, not a fork with the same branch name.
          pr_url="$(
            gh pr list --state open --base "$BASE_BRANCH" --head "$BRANCH" --json url,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"$REPO_OWNER\") | .url" |
            head -n 1
          )"
          cat > "$RUNNER_TEMP/lockfile-pr.md" <<'BODY'
          ## Thinking Path

          > - Paperclip manages AI agents and their work.
          > - Source builds require a lockfile that matches workspace manifests.
          > - Manifest changes can leave the checked-in lockfile stale.
          > - Frozen installs reject stale lockfiles before builds start.
          > - This automated refresh resolves the default branch manifests.
          > - The resulting lockfile restores reproducible dependency installation.

          ## Linked Issues or Issue Description

          **What happened?**

          The default branch manifests require a generated lockfile update.

          **Expected behavior**

          Frozen installs accept the lockfile without changing dependency metadata.

          **Steps to reproduce**

          Run `pnpm install --frozen-lockfile` on the base branch before this refresh.

          ## What Changed

          - Regenerate only `pnpm-lock.yaml` using pnpm 9.15.4 and the default branch manifests.

          ## Verification

          - Dependency resolution completed with lifecycle scripts disabled.
          - The workflow rejects changes outside `pnpm-lock.yaml`.
          - Full application validation is reported by the PR checks.

          ## Risks

          Dependency resolution can change package versions or integrity hashes. Review the generated diff and require passing checks before merge.

          ## Model Used

          The lockfile is generated by pnpm. The workflow and PR template were assisted by OpenAI GPT-6 through Codex using repository inspection, shell tools, and tests. Exact deployment identifier and context window are not exposed.

          ## Checklist

          - [x] I have included a thinking path that traces from project context to this change
          - [x] I have specified the model used (with version and capability details)
          - [x] I have checked ROADMAP.md and confirmed this PR does not duplicate planned core work (dependency maintenance only)
          - [x] I have searched GitHub for duplicate or related PRs and linked them above (the workflow reuses the existing refresh PR)
          - [x] I have described the issue in-PR following the relevant issue template
          - [x] I have not referenced internal/instance-local Paperclip issues or links
          - [x] My branch name describes the change and contains no internal Paperclip ticket id
          - [ ] I have run tests locally and they pass (see PR checks)
          - [x] I have added or updated tests where applicable (generated metadata only)
          - [x] I have updated relevant documentation to reflect my changes (no command changes)
          - [x] I have considered and documented any risks above
          - [ ] All Paperclip CI gates are green
          - [ ] Greptile is 5/5 with no open P2s, recommendations, or follow-ups
          - [x] I will address all Greptile and reviewer comments before requesting merge
          BODY
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --head "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "chore(lockfile): refresh pnpm-lock.yaml" \
              --body-file "$RUNNER_TEMP/lockfile-pr.md")"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for lockfile PR
        # A manual repair opens a PR for review; it must not merge as a side effect.
        if: github.event_name == 'push' && steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash --delete-branch "${{ steps.upsert-pr.outputs.pr_url }}"
